version: '3.8'

services:
  njz-music-player:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: njz-music-player
    ports:
      - "3000:80"
    restart: unless-stopped
    # 可选：健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

